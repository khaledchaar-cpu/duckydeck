# Built-in command actions: "run a command + show an icon".
# Schema: docs/spec/actions.md. Every entry is checked by the catalog test
# (icons exist, omarchy routes exist, placeholders complete).
#
# Placeholders like "{mode}" are filled from the binding's `args` (falling
# back to `defaults`) and always stay inside their own argument.

# ── System ────────────────────────────────────────────────────────────
[system.lock]
label = "Lock"
icon  = "lock"
run   = ["omarchy", "system", "lock"]

[system.suspend]
label = "Suspend"
icon  = "suspend"
run   = ["systemctl", "suspend"]

[system.reboot]
label   = "Reboot"
icon    = "reboot"
run     = ["omarchy", "system", "reboot"]
confirm = "long-press"

[system.shutdown]
label   = "Power off"
icon    = "power"
run     = ["omarchy", "system", "shutdown"]
confirm = "long-press"

[system.logout]
label   = "Log out"
icon    = "logout"
run     = ["omarchy", "system", "logout"]
confirm = "long-press"

[system.menu]
label = "Menu"
icon  = "omarchy-menu"
run   = ["omarchy", "menu", "toggle"]

[system.theme]
label = "Theme"
icon  = "theme"
run   = ["omarchy", "theme", "switcher"]

[system.wallpaper]
label = "Wallpaper"
icon  = "wallpaper"
run   = ["omarchy", "theme", "bg", "next"]

[system.nightlight]
label = "Night light"
icon  = { on = "nightlight", off = "nightlight-off" }
run   = ["omarchy", "toggle", "nightlight"]

[system.idle]
label = "Stay awake"
icon  = { on = "idle-inhibit", off = "idle-inhibit-off" }
run   = ["omarchy", "toggle", "idle"]

[system.dnd]
label = "Silence"
icon  = "dnd"
run   = ["omarchy", "toggle", "notification", "silencing"]

# ── Capture ───────────────────────────────────────────────────────────
[capture.screenshot]
label    = "Screenshot"
icon     = "screenshot-region"
run      = ["omarchy", "capture", "screenshot", "{mode}"]
defaults = { mode = "smart" }

[capture.ocr]
label = "OCR"
icon  = "ocr"
run   = ["omarchy", "capture", "text"]

[capture.qr]
label = "QR code"
icon  = "qr"
run   = ["omarchy", "capture", "qr"]

# ── Launcher ──────────────────────────────────────────────────────────
[launcher.terminal]
label = "Terminal"
icon  = "terminal"
run   = ["omarchy", "launch", "terminal"]

[launcher.browser]
label = "Browser"
icon  = "browser"
run   = ["omarchy", "launch", "browser"]

[launcher.files]
label = "Files"
icon  = "files"
run   = ["omarchy", "launch", "nautilus"]

# ── Window management ─────────────────────────────────────────────────
# `dispatch` entries are Hyprland Lua dispatchers sent over the IPC socket.
# Their placeholder values may only contain letters, digits and `_+-:`.
[window.workspace]
label    = "Workspace"
icon     = "workspace"
dispatch = 'hl.dsp.focus({ workspace = "{n}" })'
defaults = { n = 1 }

[window.move_to_workspace]
label    = "Move"
icon     = "move-to-workspace"
dispatch = 'hl.dsp.window.move({ workspace = "{n}" })'
defaults = { n = 1 }

[window.close]
label    = "Close"
icon     = "close-window"
dispatch = 'hl.dsp.window.close()'

[window.float]
label    = "Float"
icon     = "float"
dispatch = 'hl.dsp.window.float({ action = "toggle" })'

[window.fullscreen]
label    = "Fullscreen"
icon     = "fullscreen"
dispatch = 'hl.dsp.window.fullscreen({ mode = "fullscreen" })'

[window.pseudo]
label    = "Pseudo"
icon     = "pseudo"
dispatch = 'hl.dsp.window.pseudo()'

[window.split]
label    = "Split"
icon     = "split"
dispatch = 'hl.dsp.layout("togglesplit")'

[window.focus]
label    = "Focus"
icon     = "focus-right"
dispatch = 'hl.dsp.focus({ direction = "{dir}" })'
defaults = { dir = "r" }

[window.scratchpad]
label    = "Scratchpad"
icon     = "scratchpad"
dispatch = 'hl.dsp.workspace.toggle_special("scratchpad")'

[window.tiled_fullscreen]
label = "Tiled full"
icon  = "fullscreen"
run   = ["omarchy", "hyprland", "window", "tiled", "fullscreen", "toggle"]

[window.pop]
label = "Pop out"
icon  = "pop-out"
run   = ["omarchy", "hyprland", "window", "pop"]

[window.transparency]
label = "Opacity"
icon  = "transparency"
run   = ["omarchy", "hyprland", "window", "transparency", "toggle"]

[window.gaps]
label = "Gaps"
icon  = "gaps-toggle"
run   = ["omarchy", "hyprland", "window", "gaps", "toggle"]

[window.layout]
label = "Layout"
icon  = "layout-toggle"
run   = ["omarchy", "hyprland", "workspace", "layout", "toggle"]
