# Built-in command actions: "run a command + show an icon".
# Schema: docs/spec/actions.md. Every entry is checked by the catalog test
# (icons exist, omarchy routes exist, placeholders complete).
#
# Placeholders like "{mode}" are filled from the binding's `args` (falling
# back to `defaults`) and always stay inside their own argument.
# `choices` lists the allowed values of a placeholder (checked, and offered
# as a selection in the editor).

# ── System ────────────────────────────────────────────────────────────
[system.lock]
label = "Lock"
icon  = "lock"
run   = ["omarchy", "system", "lock"]

[system.suspend]
label = "Suspend"
icon  = "suspend"
run   = ["systemctl", "suspend"]

[system.reboot]
label   = "Reboot"
icon    = "reboot"
run     = ["omarchy", "system", "reboot"]
confirm = "long-press"

[system.shutdown]
label   = "Power off"
icon    = "power"
run     = ["omarchy", "system", "shutdown"]
confirm = "long-press"

[system.logout]
label   = "Log out"
icon    = "logout"
run     = ["omarchy", "system", "logout"]
confirm = "long-press"

[system.menu]
label = "Menu"
icon  = "omarchy-menu"
run   = ["omarchy", "menu", "toggle"]

[system.theme]
label = "Theme"
icon  = "theme"
run   = ["omarchy", "theme", "switcher"]

[system.wallpaper]
label = "Wallpaper"
icon  = "wallpaper"
run   = ["omarchy", "theme", "bg", "next"]

[system.nightlight]
label = "Night light"
icon  = { on = "nightlight", off = "nightlight-off" }
run   = ["omarchy", "toggle", "nightlight"]
# hyprsunset has no change event: checked at startup and after each press.
state = { command = ["omarchy", "toggle", "nightlight", "--status"], json = "enabled" }

[system.idle]
label = "Stay awake"
icon  = { on = "idle-inhibit", off = "idle-inhibit-off" }
run   = ["omarchy", "toggle", "idle"]
state = { file = "~/.local/state/omarchy/indicators/stay-awake" }

[system.dnd]
label = "Silence"
icon  = { on = "dnd", off = "notifications" }
run   = ["omarchy", "toggle", "notification", "silencing"]
state = { file = "~/.local/state/omarchy/notifications.json", json = "dnd" }

# No omarchy route; the shell's own IPC target.
[system.dismiss_notifications]
label = "Dismiss"
icon  = "notifications-dismiss"
run   = ["omarchy-shell", "notifications", "dismissAll"]

# Shell panels (audio, Bluetooth, Wi-Fi …) are toggled via the shell's own IPC.
[system.panel]
label    = "Panel"
icon     = "shell-panel"
run      = ["omarchy-shell", "shell", "toggle", "{panel}", "{}"]
defaults = { panel = "omarchy.audio" }
choices  = { panel = ["omarchy.audio", "omarchy.bluetooth", "omarchy.network", "omarchy.power"] }
choice_icons = { panel = { "omarchy.audio" = "volume", "omarchy.bluetooth" = "bluetooth", "omarchy.network" = "wifi", "omarchy.power" = "battery" } }

[system.bluetooth]
label = "Bluetooth"
icon  = { on = "bluetooth", off = "bluetooth-off" }
run   = ["omarchy", "bluetooth", "power", "toggle"]
# No change event; the exit code of `is-on` is the state.
state = { command = ["omarchy", "bluetooth", "power", "is-on"], refresh = ["bluetooth"] }
text  = { builtin = "bluetooth-device", refresh = ["bluetooth"] }

[system.power_profile]
label    = "Power profile"
icon     = "power-profile"
run      = ["omarchy", "powerprofiles", "set", "autodetect", "{profile}"]
defaults = { profile = "balanced" }
choices  = { profile = ["power-saver", "balanced", "performance"] }
choice_icons = { profile = { "power-saver" = "power-saver", "balanced" = "power-profile", "performance" = "power-performance" } }
# No omarchy getter for the active profile; the key lights up when active.
text     = { command = ["powerprofilesctl", "get"], refresh = ["power-profile"], active = "profile" }

[system.touchpad]
label = "Touchpad"
icon  = "touchpad"
run   = ["omarchy", "toggle", "touchpad", "toggle"]

[system.keyboard_backlight]
label = "Key light"
icon  = "keyboard-backlight"
run   = ["omarchy", "brightness", "keyboard", "cycle"]
# sysfs has no change event: read at startup and after each press.
text  = { builtin = "keyboard-backlight" }

[system.reminder]
label    = "Reminder"
icon     = "reminder"
run      = ["omarchy", "reminder", "{minutes}"]
defaults = { minutes = "10" }
# Due time of the next reminder; read again when it is due and whenever a
# reminder timer is created or removed (also outside DuckyDeck).
text     = { builtin = "reminder", refresh = ["reminder"] }

[system.agent]
label = "Agent"
icon  = "agent"
run   = ["omarchy", "agent"]

[media.output_switch]
label = "Output"
icon  = "audio-output-switch"
run   = ["omarchy", "audio", "output", "switch"]
text  = { builtin = "audio-output", refresh = ["audio"] }

[media.source_switch]
label    = "Source"
icon     = "media-source-switch"
run      = ["omarchy", "audio", "source", "switch", "{dir}"]
defaults = { dir = "next" }
choices  = { dir = ["next", "previous"] }
# The shell picks the active player; its IPC reports which one.
text     = { command = ["omarchy-shell", "media", "status"], json = "identity", refresh = ["media"] }

# ── Capture ───────────────────────────────────────────────────────────
[capture.screenshot]
label    = "Screenshot"
icon     = "screenshot-region"
run      = ["omarchy", "capture", "screenshot", "{mode}"]
defaults = { mode = "smart" }
choices  = { mode = ["smart", "region", "windows", "fullscreen"] }

# The script toggles itself and writes the file while recording; its mtime
# is the start time. `opts` passes one script option instead of the default
# "--fullscreen" (e.g. "--with-microphone-audio" records a picked region).
[capture.screenrecording]
label    = "Record"
icon     = { on = "record-stop", off = "record" }
run      = ["omarchy", "capture", "screenrecording", "{opts}"]
defaults = { opts = "--fullscreen" }
state    = { file = "/tmp/omarchy-screenrecord-filename", elapsed = true }

# Same as Omarchy's Super+Print binding (no omarchy route).
[capture.color_picker]
label = "Color"
icon  = "color-picker"
run   = ["hyprpicker", "-a"]

[capture.ocr]
label = "OCR"
icon  = "ocr"
run   = ["omarchy", "capture", "text"]

[capture.qr]
label = "QR code"
icon  = "qr"
run   = ["omarchy", "capture", "qr"]

# ── Launcher ──────────────────────────────────────────────────────────
[launcher.terminal]
label = "Terminal"
icon  = "terminal"
run   = ["omarchy", "launch", "terminal"]

[launcher.browser]
label = "Browser"
icon  = "browser"
run   = ["omarchy", "launch", "browser"]

[launcher.files]
label = "Files"
icon  = "files"
run   = ["omarchy", "launch", "nautilus"]

# Any installed app by desktop-entry id (`app = "org.gnome.Calculator"`),
# started like the Omarchy app launcher does.
[launcher.app]
label = "App"
icon  = "generic-app"
run   = ["uwsm-app", "--", "gtk-launch", "{app}.desktop"]

# ── Window management ─────────────────────────────────────────────────
# `dispatch` entries are Hyprland Lua dispatchers sent over the IPC socket.
# Their placeholder values may only contain letters, digits and `_+-:`.
[window.workspace]
label    = "Workspace"
icon     = "workspace"
dispatch = 'hl.dsp.focus({ workspace = "{n}" })'
defaults = { n = 1 }

[window.move_to_workspace]
label    = "Move"
icon     = "move-to-workspace"
dispatch = 'hl.dsp.window.move({ workspace = "{n}" })'
defaults = { n = 1 }

[window.close]
label    = "Close"
icon     = "close-window"
dispatch = 'hl.dsp.window.close()'

[window.float]
label    = "Float"
icon     = "float"
dispatch = 'hl.dsp.window.float({ action = "toggle" })'

[window.fullscreen]
label    = "Fullscreen"
icon     = "fullscreen"
dispatch = 'hl.dsp.window.fullscreen({ mode = "fullscreen" })'

[window.pseudo]
label    = "Pseudo"
icon     = "pseudo"
dispatch = 'hl.dsp.window.pseudo()'

[window.split]
label    = "Split"
icon     = "split"
dispatch = 'hl.dsp.layout("togglesplit")'

[window.focus]
label    = "Focus"
icon     = "focus-right"
dispatch = 'hl.dsp.focus({ direction = "{dir}" })'
defaults = { dir = "r" }
choices  = { dir = ["l", "r", "u", "d"] }
choice_icons = { dir = { l = "focus-left", r = "focus-right", u = "focus-up", d = "focus-down" } }

[window.scratchpad]
label    = "Scratchpad"
icon     = "scratchpad"
dispatch = 'hl.dsp.workspace.toggle_special("scratchpad")'

[window.tiled_fullscreen]
label = "Tiled full"
icon  = "fullscreen"
run   = ["omarchy", "hyprland", "window", "tiled", "fullscreen", "toggle"]

[window.pop]
label = "Pop out"
icon  = "pop-out"
run   = ["omarchy", "hyprland", "window", "pop"]

[window.transparency]
label = "Opacity"
icon  = "transparency"
run   = ["omarchy", "hyprland", "window", "transparency", "toggle"]

[window.gaps]
label = "Gaps"
icon  = "gaps-toggle"
run   = ["omarchy", "hyprland", "window", "gaps", "toggle"]

[window.layout]
label = "Layout"
icon  = "layout-toggle"
run   = ["omarchy", "hyprland", "workspace", "layout", "toggle"]

[window.move]
label    = "Move"
icon     = "move-window"
dispatch = 'hl.dsp.window.swap({ direction = "{dir}" })'
defaults = { dir = "r" }
choices  = { dir = ["l", "r", "u", "d"] }

[window.to_monitor]
label    = "To monitor"
icon     = "move-to-monitor"
dispatch = 'hl.dsp.window.move({ monitor = "{monitor}" })'
defaults = { monitor = "+1" }

[window.monitor_internal]
label    = "Laptop"
icon     = "monitor"
run      = ["omarchy", "hyprland", "monitor", "internal", "{mode}"]
defaults = { mode = "toggle" }
choices  = { mode = ["on", "off", "toggle", "recover"] }

[window.monitor_mirror]
label    = "Mirror"
icon     = "monitor-mirror"
run      = ["omarchy", "hyprland", "monitor", "internal", "mirror", "{mode}"]
defaults = { mode = "toggle" }
choices  = { mode = ["on", "off", "toggle", "recover"] }

# Any Hyprland dispatcher, e.g. expr = 'hl.dsp.window.move({ monitor = "+1" })'.
# The profile value must start with `hl.dsp.` and be a single line.
[window.dispatch]
label    = "Dispatch"
icon     = "dispatch"
dispatch = '{expr}'
raw      = ["expr"]
