[package]
name = "duckydeckd"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
duckydeck-core.workspace = true
elgato-streamdeck = "0.13"
image = { version = "0.25", default-features = false, features = ["png"] }
serde.workspace = true
serde_json.workspace = true
inotify = { version = "0.11", default-features = false, features = ["stream"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1.19"
tracing.workspace = true
tracing-subscriber.workspace = true
udev = "0.9"
# MPRIS media players on the session bus.
zbus = { version = "5", default-features = false, features = ["tokio"] }

[lints]
workspace = true
