[workspace]
resolver = "3"
members = ["crates/duckydeck-core", "crates/duckydeckd", "crates/duckydeck-cli"]

[workspace.package]
version = "0.1.4"
edition = "2024"

[workspace.dependencies]
duckydeck-core = { path = "crates/duckydeck-core" }
anyhow = "1"
regex-lite = "0.1"
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
insta = "1"
resvg = { version = "0.48", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
thiserror = "2"
tokio = { version = "1", features = ["process", "time", "rt", "macros", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
