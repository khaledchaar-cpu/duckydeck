# Icon mapping: duckydeck name = "tabler name", grouped by category.
# `scripts/fetch-icons.sh` copies each entry to icons/<category>/<name>.svg.
# Custom icons (no Tabler motif) live in icons/custom/ and are listed under
# [custom] with an empty value; the script leaves them alone.
# Workspace digits are font glyphs, not SVGs.

[tabler]
version = "3.48.0"
sha256 = "28447dcf6f0bb2b8d92c59a1b3d30900a180de2e97d7db4d267e6320dc68f449"

# Toggle pairs: active icon = inactive icon.
[pairs]
nightlight = "nightlight-off"
idle-inhibit = "idle-inhibit-off"
notifications = "dnd"
volume = "volume-off"
mic = "mic-off"
wifi = "wifi-off"
bluetooth = "bluetooth-off"
record = "record-stop"
play = "pause"

[system]
lock = "lock"
suspend = "zzz"
reboot = "refresh"
power = "power"
logout = "logout"
theme = "palette"
wallpaper = "photo"
nightlight = "moon"
